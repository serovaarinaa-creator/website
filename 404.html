<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Арина Серова</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Manrope:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 24px;
      text-align: center;
    }
    .notfound__pills {
      display: flex;
      align-items: center;
      height: 68px;
      width: min(240px, 100%);
    }
  </style>
</head>
<body>
  <main class="notfound checker">
    <p class="t-promo-1">404</p>
    <h1 class="t-h1">Такой страницы нет</h1>
    <p class="t-body-1">Похоже, ссылка устарела. Вернитесь на главную — там все проекты.</p>
    <div class="notfound__pills">
      <a class="pill t-body-2" href="/">На главную</a>
    </div>
  </main>
</body>
</html>
